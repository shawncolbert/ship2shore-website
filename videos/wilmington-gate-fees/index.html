<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Wilmington gate fees</title>
    <script src="gsap.min.js"></script>
    <script src="config.js"></script>
    <style>
      @font-face { font-family: "Oswald"; font-weight: 600; src: url("fonts/oswald-600.ttf") format("truetype"); }
      @font-face { font-family: "Source Sans 3"; font-weight: 400; src: url("fonts/sourcesans3-400.ttf") format("truetype"); }
      @font-face { font-family: "Source Sans 3"; font-weight: 600; src: url("fonts/sourcesans3-600.ttf") format("truetype"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("fonts/plexmono-500.ttf") format("truetype"); }

      :root {
        --bg: #14181d;
        --panel: #1c2229;
        --raised: #232a32;
        --line: #3a4450;
        --text: #eef1f4;
        --dim: #9aa6b0;
        --red: #c23b2e;
        --yellow: #e8b13a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Source Sans 3", sans-serif;
        overflow: hidden;
      }
      /* faint steel grid behind everything */
      #grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 90px 90px;
        opacity: 0.16;
      }
      #vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 45%, rgba(20,24,29,0) 30%, rgba(20,24,29,0.85) 100%);
      }

      /* Each scene fills the frame. Content stays between y=270 and y=1370
         (top 250px and bottom 400px are left clear for the app UI). */
      .scene {
        position: absolute; inset: 0;
        padding: 290px 80px 0 80px;
        display: flex; flex-direction: column;
      }
      .scene.center { justify-content: center; padding: 270px 80px 400px 80px; }

      .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; }
      .label {
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 36px; line-height: 1.35; letter-spacing: 3px;
        color: var(--yellow); text-transform: uppercase;
      }
      .rule { width: 120px; height: 6px; background: var(--yellow); margin: 28px 0 40px 0; }
      .rule.red { background: var(--red); }

      /* Scene 1 */
      .hook1 { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 124px; line-height: 1.08; text-transform: uppercase; color: var(--text); }
      .hook2 { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 124px; line-height: 1.08; text-transform: uppercase; color: var(--yellow); margin-top: 56px; }

      /* Scene 2 */
      .fee {
        display: flex; align-items: center; justify-content: space-between;
        background: var(--panel); border: 2px solid var(--line); border-left: 8px solid var(--yellow);
        padding: 0 36px; height: 128px; margin-bottom: 24px;
      }
      .fee .t { font-family: "Source Sans 3", sans-serif; font-weight: 600; font-size: 46px; color: var(--text); }
      .fee .p { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 80px; color: var(--text); }
      .totalbox { margin-top: 20px; padding-top: 28px; border-top: 4px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; }
      .totalbox .tl { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 40px; letter-spacing: 4px; color: var(--dim); }
      .totalbox .tv { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 210px; line-height: 1.2; color: var(--yellow); }

      /* Scene 3 */
      .ourcard {
        background: var(--panel); border: 2px solid var(--line); border-left: 10px solid var(--red);
        padding: 36px 44px 20px 44px; margin-bottom: 44px;
      }
      .ourcard .ot { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 84px; text-transform: uppercase; color: var(--text); line-height: 1.1; }
      .ourcard .op { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 300px; line-height: 1.05; color: var(--red); }
      .body {
        font-family: "Source Sans 3", sans-serif; font-weight: 600; font-size: 48px; line-height: 1.28; color: var(--text);
        border-left: 4px solid var(--line); padding-left: 28px; margin-bottom: 32px;
      }

      /* Scene 4 */
      .cmp { display: flex; gap: 28px; margin-top: 20px; }
      .cmpcard { flex: 1; background: var(--panel); border: 2px solid var(--line); padding: 44px 20px 40px 20px; text-align: center; }
      .cmpcard .cl { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 3px; color: var(--dim); margin-bottom: 18px; }
      .cmpcard .cv { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 230px; line-height: 1.05; }
      #cmpOld .cv { color: var(--dim); text-decoration: line-through; text-decoration-thickness: 12px; text-decoration-color: var(--red); opacity: 0.6; }
      #cmpNew { border: 3px solid var(--red); background: var(--raised); }
      #cmpNew .cl { color: var(--yellow); }
      #cmpNew .cv { color: var(--text); }
      .cmpcap { margin-top: 56px; text-align: center; font-family: "Oswald", sans-serif; font-weight: 600; font-size: 72px; text-transform: uppercase; color: var(--yellow); }

      /* Scene 5 */
      .endwrap { align-items: center; text-align: center; padding-bottom: 80px; }
      .mark { width: 220px; height: 220px; margin-bottom: 26px; }
      .brandname { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 128px; letter-spacing: 8px; color: var(--text); line-height: 1; }
      .endrule { width: 160px; height: 6px; background: var(--red); margin: 52px 0; }
      .tagline { font-family: "Source Sans 3", sans-serif; font-weight: 600; font-size: 56px; line-height: 1.2; color: #fff; max-width: 650px; margin: 0 0 44px 0; }
      .callline { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 74px; line-height: 1.15; color: var(--yellow); text-transform: none; }
      .web { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 48px; letter-spacing: 1px; color: var(--text); margin-top: 36px; }

      /* Fine print: on screen from scene 2 to the end */
      #fine {
        position: absolute; left: 80px; width: 920px; top: 1396px;
        font-family: "Source Sans 3", sans-serif; font-weight: 400; font-size: 29px; line-height: 1.3; color: var(--dim);
        border-top: 2px solid var(--line); padding-top: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="grid"></div>
      <div id="vignette"></div>

      <!-- Scene 1: hook, 0-4s -->
      <div id="s1" class="clip scene center" data-start="0" data-duration="4" data-track-index="1">
        <div id="s1in">
          <div id="hook1" class="hook1"></div>
          <div id="hook2" class="hook2"></div>
        </div>
      </div>

      <!-- Scene 2: posted gate fees, 4-12s -->
      <div id="s2" class="clip scene" data-start="4" data-duration="8" data-track-index="1">
        <div id="s2in">
          <div id="gateLabel" class="label"></div>
          <div class="rule"></div>
          <div id="fees"></div>
          <div id="totalbox" class="totalbox">
            <div class="tl">TOTAL</div>
            <div id="totalVal" class="tv">$0</div>
          </div>
        </div>
      </div>

      <!-- Scene 3: with Ship2Shore, 12-20s -->
      <div id="s3" class="clip scene" data-start="12" data-duration="8" data-track-index="1">
        <div id="s3in">
          <div id="ourLabel" class="label"></div>
          <div class="rule red"></div>
          <div id="ourcard" class="ourcard">
            <div id="ourText" class="ot"></div>
            <div id="ourPrice" class="op"></div>
          </div>
          <div id="ourLine1" class="body"></div>
          <div id="ourLine2" class="body"></div>
        </div>
      </div>

      <!-- Scene 4: comparison, 20-24s -->
      <div id="s4" class="clip scene center" data-start="20" data-duration="4" data-track-index="1">
        <div id="s4in">
          <div class="cmp">
            <div id="cmpOld" class="cmpcard"><div class="cl">GATE FEES</div><div id="cmpOldV" class="cv"></div></div>
            <div id="cmpNew" class="cmpcard"><div class="cl">SHIP2SHORE</div><div id="cmpNewV" class="cv"></div></div>
          </div>
          <div id="cmpCap" class="cmpcap"></div>
        </div>
      </div>

      <!-- Scene 5: end card, 24-30s -->
      <div id="s5" class="clip scene center endwrap" data-start="24" data-duration="6" data-track-index="1">
        <div id="s5in" style="display:flex;flex-direction:column;align-items:center;">
          <svg id="mark" class="mark" viewBox="0 0 100 100" fill="none" stroke="#e8b13a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="50" cy="50" r="46" stroke-width="2.2"/>
            <circle cx="50" cy="26" r="5.5"/>
            <path d="M50 31.5V74"/>
            <path d="M39 40H61"/>
            <path d="M25 58C27 70 37 76 50 76C63 76 73 70 75 58"/>
            <path d="M20.5 62L25 57L30 61"/>
            <path d="M70 61L75 57L79.5 62"/>
          </svg>
          <div id="brandName" class="brandname"></div>
          <div class="endrule"></div>
          <div id="tagline" class="tagline"></div>
          <div id="callLine" class="callline"></div>
          <div id="website" class="web"></div>
        </div>
      </div>

      <div id="fine" class="clip" data-start="4" data-duration="26" data-track-index="2"></div>
    </div>

    <script>
      const C = window.VIDEO_CONFIG;
      const $ = (id) => document.getElementById(id);
      const money = (n) => "$" + n;

      // ---- fill text from config.js ----
      $("hook1").textContent = C.hookLine1;
      $("hook2").textContent = C.hookLine2;
      $("gateLabel").textContent = C.gateLabel;
      C.gateFees.forEach((f, i) => {
        const row = document.createElement("div");
        row.className = "fee";
        row.id = "fee" + i;
        row.innerHTML = '<div class="t"></div><div class="p"></div>';
        row.querySelector(".t").textContent = f.text;
        row.querySelector(".p").textContent = money(f.price);
        $("fees").appendChild(row);
      });
      const gateTotal = C.gateFees.reduce((s, f) => s + f.price, 0);
      $("ourLabel").textContent = C.ourLabel;
      $("ourText").textContent = C.ourText;
      $("ourPrice").textContent = money(C.ourPrice);
      $("ourLine1").textContent = C.ourLine1;
      $("ourLine2").textContent = C.ourLine2;
      $("cmpOldV").textContent = money(gateTotal);
      $("cmpNewV").textContent = money(C.ourPrice);
      $("cmpCap").textContent = C.compareCaption;
      $("brandName").textContent = C.brandName;
      $("callLine").textContent = C.callLine;
      $("tagline").textContent = C.tagline;
      $("website").textContent = C.website;
      $("fine").textContent = C.finePrint;

      // ---- animation (one paused, seekable timeline) ----
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        const inUp = (sel, at, d = 0.55, y = 50) =>
          tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, at);
        const out = (sel, at, d = 0.4) => tl.to(sel, { opacity: 0, duration: d, ease: "power2.in" }, at);

        // Scene 1 (0-4)
        inUp("#hook1", 0.2, 0.7);
        inUp("#hook2", 1.9, 0.7);
        out("#s1in", 3.6);

        // Scene 2 (4-12)
        inUp("#gateLabel", 4.2);
        tl.fromTo("#s2 .rule", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 4.4);
        const feeTimes = [5.2, 6.4, 7.6];
        const running = { v: 0 };
        let acc = 0;
        C.gateFees.forEach((f, i) => {
          tl.fromTo("#fee" + i, { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, feeTimes[i]);
          acc += f.price;
          tl.to(running, {
            v: acc, duration: 0.9, ease: "power2.out",
            onUpdate: () => { $("totalVal").textContent = money(Math.round(running.v)); }
          }, feeTimes[i] + 0.25);
        });
        tl.fromTo("#totalbox", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.0);
        tl.fromTo("#totalVal", { scale: 1 }, { scale: 1.08, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "100% 50%" }, 9.0);
        out("#s2in", 11.6);

        // Scene 3 (12-20)
        inUp("#ourLabel", 12.2);
        tl.fromTo("#s3 .rule", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 12.4);
        tl.fromTo("#ourcard", { opacity: 0, scale: 0.94, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.4)" }, 12.9);
        inUp("#ourLine1", 15.0);
        inUp("#ourLine2", 17.0);
        out("#s3in", 19.6);

        // Scene 4 (20-24)
        tl.fromTo("#cmpOld", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 20.3);
        tl.fromTo("#cmpNew", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 21.0);
        inUp("#cmpCap", 22.0, 0.6, 30);
        out("#s4in", 23.6);

        // Scene 5 (24-30)
        tl.fromTo("#mark", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 24.2);
        inUp("#brandName", 24.6);
        inUp("#tagline", 25.0);
        inUp("#callLine", 25.4);
        inUp("#website", 26.1);

        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
