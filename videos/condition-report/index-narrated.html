<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Ship2Shore condition report video</title>
    <script src="gsap.min.js"></script>
    <script src="config-narrated.js"></script>
    <style>
      @font-face { font-family: "Oswald"; font-weight: 600; src: url("fonts/oswald-600.ttf") format("truetype"); }
      @font-face { font-family: "Source Sans 3"; font-weight: 400; src: url("fonts/sourcesans3-400.ttf") format("truetype"); }
      @font-face { font-family: "Source Sans 3"; font-weight: 600; src: url("fonts/sourcesans3-600.ttf") format("truetype"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("fonts/plexmono-500.ttf") format("truetype"); }

      :root {
        --bg: #14181d; --panel: #1c2229; --raised: #232a32; --line: #3a4450;
        --text: #eef1f4; --dim: #9aa6b0; --red: #c23b2e; --yellow: #e8b13a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; background: var(--bg); color: var(--text);
        font-family: "Source Sans 3", sans-serif; overflow: hidden; }
      #grid { position: absolute; inset: 0;
        background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 90px 90px; opacity: 0.16; }
      #vignette { position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 45%, rgba(20,24,29,0) 30%, rgba(20,24,29,0.85) 100%); }

      /* Safe zone: content sits between y=270 and y=1360 (top 250 / bottom 400 stay clear of app buttons). */
      .scene { position: absolute; inset: 0; padding: 270px 80px 560px 80px; display: flex; flex-direction: column; justify-content: center; }
      .item { margin-bottom: 40px; }
      .item:last-child { margin-bottom: 0; }

      .hook { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 124px; line-height: 1.08; text-transform: uppercase; color: var(--text); }
      .hook.y { color: var(--yellow); }
      .big { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 108px; line-height: 1.1; text-transform: uppercase; color: var(--text); }
      .big.y { color: var(--yellow); }
      .body { font-family: "Source Sans 3", sans-serif; font-weight: 600; font-size: 60px; line-height: 1.25; color: var(--text);
        border-left: 6px solid var(--yellow); padding-left: 30px; }
      .body.y { color: var(--yellow); border-left-color: var(--red); }
      .label { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 40px; letter-spacing: 3px; color: var(--yellow); text-transform: uppercase; }

      .row { display: flex; align-items: center; gap: 36px; background: var(--panel); border: 2px solid var(--line);
        border-left: 8px solid var(--yellow); padding: 34px 40px; min-height: 150px; }
      .row .badge { flex: none; width: 92px; height: 92px; border-radius: 50%; background: var(--yellow); color: var(--bg);
        font-family: "Oswald", sans-serif; font-weight: 600; font-size: 62px; display: flex; align-items: center; justify-content: center; }
      .row .rt { font-family: "Source Sans 3", sans-serif; font-weight: 600; font-size: 54px; line-height: 1.2; color: var(--text); }
      .row.numrow .rt { font-family: "Oswald", sans-serif; font-size: 82px; line-height: 1.1; }
      .row svg.chk { flex: none; width: 92px; height: 92px; }

      .photos { width: 920px; }
      .photos .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 10px; }
      .tile { background: var(--panel); border: 3px solid var(--yellow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 270px; }
      .tile .car { width: 190px; height: 95px; }
      .tile .play { width: 96px; height: 96px; }
      .tile .tl { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 36px; letter-spacing: 3px; color: var(--yellow); }
      .vtile { margin-top: 30px; height: 220px; flex-direction: row; gap: 30px; }
      .priceline { display: flex; flex-direction: column; align-items: center; text-align: center; }
      .priceline .pre { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 96px; text-transform: uppercase; color: var(--text); line-height: 1.1; }
      .priceline .pv { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 400px; line-height: 1.05; color: var(--red); }

      .endwrap { align-items: center; text-align: center; padding-bottom: 520px; }
      .mark { width: 380px; height: 380px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 44px; }
      .mark img { width: 339px; height: 339px; display: block; }
      .endrule { width: 160px; height: 6px; background: var(--red); margin: 48px 0; }
      .tagline { font-family: "Source Sans 3", sans-serif; font-weight: 600; font-size: 56px; line-height: 1.2; color: #fff; max-width: 650px; margin: 0 0 44px 0; }
      .callline { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 74px; line-height: 1.15; color: var(--yellow); }
      .web { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 48px; letter-spacing: 1px; color: var(--text); margin-top: 32px; }
      .portsline { font-family: "Source Sans 3", sans-serif; font-weight: 600; font-size: 46px; color: var(--dim); margin-top: 36px; }

      #fine { position: absolute; left: 80px; width: 920px; top: 1390px;
        font-family: "Source Sans 3", sans-serif; font-weight: 400; font-size: 29px; line-height: 1.3; color: var(--dim);
        border-top: 2px solid var(--line); padding-top: 14px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920">
      <div id="grid"></div>
      <div id="vignette"></div>
      <div id="scenes"></div>
      <div id="endscene"></div>
      <div id="fine" class="clip" data-track-index="2"></div>
    </div>

    <script>
      const C = window.VIDEO_CONFIG;
      const $ = (id) => document.getElementById(id);
      const root = $("root");
      root.setAttribute("data-duration", C.duration);

      const CHECK = '<svg class="chk" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="46" fill="#e8b13a"/><path class="cp" d="M27 52L43 68L74 34" stroke="#14181d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      const CAR = '<svg class="car" viewBox="0 0 120 60" fill="none" stroke="#9aa6b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 40V32L20 29L34 14H78L94 29L110 33V40"/><path d="M8 40H112"/><path d="M38 18H60V29H30Z"/><path d="M64 18H76L88 29H64Z"/><circle cx="32" cy="42" r="8" fill="#232a32"/><circle cx="88" cy="42" r="8" fill="#232a32"/></svg>';
      const PLAY = '<svg class="play" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#e8b13a" stroke-width="5"/><path d="M40 30L72 50L40 70Z" fill="#e8b13a"/></svg>';
      // ---- build scenes from config.js ----
      const anims = []; // [selector, atSeconds, kind]
      C.scenes.forEach((sc, si) => {
        const el = document.createElement("div");
        el.id = "s" + si;
        el.className = "clip scene";
        el.setAttribute("data-start", sc.start);
        el.setAttribute("data-duration", sc.end - sc.start);
        el.setAttribute("data-track-index", 1);
        const inner = document.createElement("div");
        inner.id = "s" + si + "in";
        let stepNo = 0;
        sc.items.forEach((it, ii) => {
          const id = "s" + si + "i" + ii;
          const d = document.createElement("div");
          d.id = id;
          d.className = "item";
          const k = it.kind;
          if (k === "hook" || k === "big") { d.className += " " + k + (it.yellow ? " y" : ""); d.textContent = it.text; }
          else if (k === "label") { d.className += " label"; d.textContent = it.text; }
          else if (k === "body") { d.className += " body" + (it.yellow ? " y" : ""); d.textContent = it.text; }
          else if (k === "step") { stepNo++; d.className += " row"; d.innerHTML = '<div class="badge"></div><div class="rt"></div>';
            d.querySelector(".badge").textContent = stepNo; d.querySelector(".rt").textContent = it.text; }
          else if (k === "num") { d.className += " row numrow"; d.innerHTML = '<div class="rt"></div>'; d.querySelector(".rt").textContent = it.text; }
          else if (k === "check") { d.className += " row"; d.innerHTML = CHECK + '<div class="rt"></div>'; d.querySelector(".rt").textContent = it.text; }
          else if (k === "photos") {
            d.className += " photos";
            let h = '<div class="grid2">';
            for (let n = 1; n <= 4; n++) h += '<div class="tile" id="' + id + 't' + n + '">' + CAR + '<div class="tl">PHOTO ' + n + '</div></div>';
            h += '</div><div class="tile vtile" id="' + id + 'v">' + PLAY + '<div class="tl">WALKAROUND VIDEO</div></div>';
            d.innerHTML = h;
            for (let n = 1; n <= 4; n++) anims.push([ "#" + id + "t" + n, it.tiles[n - 1], "tile" ]);
            anims.push([ "#" + id + "v", it.video, "tile" ]);
          }
          else if (k === "price") { d.className += " priceline"; d.innerHTML = '<div class="pre"></div><div class="pv"></div>';
            d.querySelector(".pre").textContent = it.text; d.querySelector(".pv").textContent = it.price; }
          if (it.size) { const t = d.querySelector(".rt") || d; t.style.fontSize = it.size + "px"; }
          inner.appendChild(d);
          if (k !== "photos") anims.push([ "#" + id, it.at, k ]);
        });
        el.appendChild(inner);
        $("scenes").appendChild(el);
        anims.push([ "#s" + si + "in", sc.end - 0.4, "out" ]);
      });

      // ---- end card ----
      const E = C.end;
      const es = document.createElement("div");
      es.id = "s_end";
      es.className = "clip scene endwrap";
      es.setAttribute("data-start", E.start);
      es.setAttribute("data-duration", C.duration - E.start);
      es.setAttribute("data-track-index", 1);
      es.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;">' +
        '<div id="mark" class="mark"><img src="logo.png" alt="Ship2Shore logo"></div>' +
        '<div class="endrule"></div><div id="tagline" class="tagline"></div><div id="callLine" class="callline"></div>' +
        '<div id="website" class="web"></div><div id="portsLine" class="portsline"></div></div>';
      $("endscene").appendChild(es);
      $("callLine").textContent = E.callLine;
      $("tagline").textContent = E.tagline;
      $("website").textContent = E.website;
      $("portsLine").textContent = E.extraLine || "";

      const fine = $("fine");
      fine.setAttribute("data-start", C.finePrintFrom);
      fine.setAttribute("data-duration", C.duration - C.finePrintFrom);
      fine.textContent = C.finePrint;

      // ---- animation (one paused, seekable timeline) ----
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        anims.forEach(([sel, at, kind]) => {
          if (kind === "out") tl.to(sel, { opacity: 0, duration: 0.4, ease: "power2.in" }, at);
          else if (kind === "step" || kind === "num" || kind === "check")
            tl.fromTo(sel, { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, at);
          else if (kind === "tile")
            tl.fromTo(sel, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, at);
          else if (kind === "price")
            tl.fromTo(sel, { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.4)" }, at);
          else
            tl.fromTo(sel, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, at);
        });
        const e = E.start; const T = E.times || {};
        tl.fromTo("#mark", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, T.mark ?? e + 0.2);
        tl.fromTo("#tagline", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, T.tagline ?? e + 0.9);
        tl.fromTo("#callLine", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, T.call ?? e + 1.2);
        tl.fromTo("#website", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, T.web ?? e + 1.8);
        tl.fromTo("#portsLine", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, T.ports ?? e + 2.4);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
